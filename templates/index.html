<!DOCTYPE html>
<html>
<head>
    <title>Модуляция изображений</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Модуляция изображения</h1>
        <form method="post" action="{{ url_for('process') }}" enctype="multipart/form-data">
            <div class="form-group">
                <label>Выберите изображение:</label>
                <input type="file" name="image" accept="image/*" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Ось модуляции:</label>
                    <select name="axis">
                        <option value="x">Горизонтальная (X)</option>
                        <option value="y">Вертикальная (Y)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Функция:</label>
                    <select name="function">
                        <option value="sin">Sin</option>
                        <option value="cos">Cos</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Период (пиксели, >=2):</label>
                <input type="number" name="period" value="80" min="2">
            </div>

            <!-- НОВИНКА: чекбокс для времени -->
            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" name="add_timestamp">
                    Добавить дату и время создания на изображение
                </label>
                <small>Время будет нанесено в правый нижний угол</small>
            </div>

            <div class="captcha-box">
                Капча: {{ captcha_question }}
                <input type="text" name="captcha" placeholder="Ваш ответ" required>
            </div>

            <button type="submit">Обработать изображение</button>
        </form>
    </div>
</div>
</body>
</html>
